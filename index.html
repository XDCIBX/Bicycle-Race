<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Velo Rush 2.5D — велогонки</title>
  <meta name="description" content="Велогонка 2.5D: реальные велосипеды, улучшения, тренировки гонщика и соперники.">
  <meta name="theme-color" content="#0f1218">
  <!-- iPhone: запуск с экрана «Домой» в полноэкранном режиме -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Velo Rush">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo"><span class="logo-mark">🚴</span> VELO RUSH <small>2.5D</small></div>
      <nav class="tabs">
        <button data-screen="race" class="active"><i>🏁</i> Гонки</button>
        <button data-screen="rider"><i>🧑</i> Гонщик</button>
        <button data-screen="garage"><i>🔧</i> Гараж</button>
        <button data-screen="shop"><i>🛒</i> Магазин</button>
        <button data-screen="trophies"><i>🏆</i> Трофеи</button>
      </nav>
      <div class="hdr-right"><span class="hdr-level" id="hdr-level">Ур. 1</span><div class="money" id="money">🪙 0</div></div>
    </header>
    <main id="screen"></main>
  </div>

  <div class="build" id="build">Velo Rush · сборка 6</div>
  <div class="overlay" id="prerace" hidden></div>

  <div id="race-view" hidden>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hud-top-left">
        <div class="hud-pos"><span id="hud-pos">1</span><small>/<span id="hud-total">6</span></small></div>
        <div class="hud-lap" id="hud-lap">Круг 1/2</div>
        <div class="hud-time" id="hud-time">00:00.0</div>
        <ol class="hud-board" id="hud-board"></ol>
      </div>
      <canvas id="minimap" width="200" height="200"></canvas>
      <div class="hud-bottom">
        <div class="hud-info">
          <div class="hud-surface"><span class="dot" id="hud-surf-dot"></span><span id="hud-surf">Асфальт</span><span id="hud-slope"></span></div>
          <div class="hud-tactic" id="hud-tactic"></div>
        </div>
        <div class="hud-speed"><span id="hud-speed">0</span><small>км/ч</small></div>
        <div class="hud-energy"><div class="bar"><div id="hud-energy"></div></div><small>Энергия</small></div>
      </div>
      <div class="hud-legs" id="hud-legs" hidden></div>
      <div class="hud-center" id="hud-center"></div>
      <div class="hud-event" id="hud-event"></div>
      <div class="tri-controls" id="tri-controls" hidden>
        <button data-pace="easy">🐢 Спокойно</button><button data-pace="steady">⚖️ Ровно</button><button data-pace="hard">🔥 Мощно</button>
        <button id="btn-skip" title="Перемотать этап">⏭</button>
      </div>
      <div class="hud-buttons">
        <button class="hud-btn" id="btn-speed" title="Скорость времени (F)">×1</button>
        <button class="hud-btn" id="btn-pause" title="Пауза (Esc)">⏸</button>
      </div>
      <button class="sprint-btn" id="btn-sprint" title="Спурт (Пробел)">⚡<span>Спурт</span></button>
    </div>
    <div class="overlay" id="pause" hidden>
      <div class="panel">
        <h2>Пауза</h2>
        <div class="muted" style="font-size:12px">Сборка 6</div>
        <button class="btn primary" id="btn-resume">Продолжить</button>
        <button class="btn" id="btn-restart">Начать заново</button>
        <button class="btn" id="btn-quit">Выйти в меню</button>
      </div>
    </div>
    <div class="overlay" id="results" hidden></div>
  </div>

  <script src="js/data.js?v=6"></script>
  <script src="assets/photos/credits.js?v=6"></script>
  <script src="js/state.js?v=6"></script>
  <script src="js/track.js?v=6"></script>
  <script src="js/progression.js?v=6"></script>
  <script src="js/render.js?v=6"></script>
  <script src="js/race.js?v=6"></script>
  <script src="js/triathlon.js?v=6"></script>
  <script src="js/bikeart.js?v=6"></script>
  <script src="js/photos.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
  <script>
    // Офлайн-режим и установка на iPhone: сервис-воркер кэширует игру и фото.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      // Когда вышла новая версия игры, новый сервис-воркер берёт управление — перезагружаемся один раз,
      // чтобы сразу увидеть обновление, а не старую копию из кэша.
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !reloaded && !window.VeloRush?.race) { reloaded = true; location.reload(); }
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=6').then((reg) => reg.update()).catch(() => {}));
    }
  </script>
</body>
</html>
