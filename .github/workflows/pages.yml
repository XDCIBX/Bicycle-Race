# Публикация игры на GitHub Pages: после включения Pages (Settings → Pages → Source: GitHub Actions)
# игра откроется по адресу https://<владелец>.github.io/<репозиторий>/ — на iPhone её можно
# добавить на экран «Домой» через «Поделиться» → «На экран „Домой“».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/2d5-bike-racing-game-9212gh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-www.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
